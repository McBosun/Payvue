<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payvue – smart money app</title>
<style>
:root{--bg:#F4F6F1;--card:#fff;--ink:#0E1B2C;--mut:#5d6b7c;--line:#e1e6dd;--brand:#0E1B2C;--on:#fff;--acc:#F5B700;--ok:#12805C;--bad:#C93A3F;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0A121D;--card:#132033;--ink:#EEF2F6;--mut:#9aa9bb;--line:#22344c;--brand:#1B3150;--ok:#3DD6A3;--bad:#FF7A7F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:480px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hero{background:var(--brand);color:var(--on);border-radius:22px;padding:20px;margin:12px 0}
.hero small{opacity:.75}.bal{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px 0 8px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{display:block;font-size:14px;color:var(--mut);margin-top:10px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:#0E1B2C;border:0;border-radius:12px;padding:12px 16px;font-weight:800;width:100%;margin-top:14px}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:inherit;text-decoration:underline;padding:4px}
.small{width:auto;margin:0;padding:8px 12px;font-size:14px}
.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--on)}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:15px;background:var(--bg);border-left:4px solid var(--acc)}
.msg.err{border-color:var(--bad)}.msg.ok{border-color:var(--ok)}
.msg ul{margin:6px 0 0 18px;padding:0}
.tx{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}.neg{color:var(--bad)}.pos{color:var(--ok)}.mut{color:var(--mut);font-size:13px}
#banner{background:var(--acc);color:#0E1B2C;text-align:center;padding:8px 12px;font-size:14px;font-weight:600}
[hidden]{display:none!important}
</style></head><body>
<div id="banner" role="status" hidden>Waking the server. The first load can take up to a minute.</div>
<main>
<section id="auth">
  <h1>Payvue</h1><p class="mut">Send, save and pay, all in one place.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabUp" aria-selected="true">Sign up</button>
    <button role="tab" id="tabIn" aria-selected="false">Log in</button>
  </div>
  <div class="card">
    <div id="nameRow"><label for="name">Full name</label><input id="name" autocomplete="name"></div>
    <label for="phone">Phone number</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08012345678">
    <label for="pin">PIN (4 to 6 digits)</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6">
    <button class="btn" id="authBtn">Create account</button>
    <div id="authMsg" class="msg" role="status" hidden></div>
  </div>
</section>

<section id="app" hidden>
  <div class="row"><h2 id="hello">Hi</h2><button class="link" id="logout">Log out</button></div>
  <div class="hero">
    <small>Available balance</small>
    <div class="bal" id="bal">...</div>
    <div class="row"><small id="acct"></small><button class="link" id="copy" style="color:inherit">Copy</button></div>
  </div>
  <button class="btn small" id="fund" hidden style="width:100%;margin-bottom:6px">Add test money (₦5,000)</button>

  <form class="card" id="sendForm" autocomplete="off">
    <h3>Send money</h3>
    <label for="to">Recipient account number</label><input id="to" inputmode="numeric" maxlength="10">
    <label for="amt">Amount (₦)</label><input id="amt" inputmode="decimal">
    <label for="note">Note (optional)</label><input id="note" maxlength="60">
    <div id="pinBox" hidden><label for="spin">Enter your PIN to confirm</label><input id="spin" type="password" inputmode="numeric" maxlength="6"></div>
    <button class="btn" id="sendBtn" type="submit">Send</button>
    <div id="sendMsg" class="msg" role="status" hidden></div>
  </form>

  <div class="card"><div class="row"><h3>Recent activity</h3><button class="link" id="refresh">Refresh</button></div><div id="txs"></div></div>
</section>
</main>
<script>
const API = 'https://payvue.onrender.com';
const $ = (s) => document.querySelector(s);
const naira = (k) => '₦' + (k / 100).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const store = {
  get: (k, area = sessionStorage) => { try { return area.getItem(k); } catch { return null; } },
  set: (k, v, area = sessionStorage) => { try { area.setItem(k, v); } catch {} },
  del: (k) => { try { sessionStorage.removeItem(k); } catch {} },
};
function deviceId() {
  let d = store.get('pv_dev', localStorage);
  if (!d) { d = crypto.randomUUID(); store.set('pv_dev', d, localStorage); }
  return d;
}
function say(el, text, kind, list) {
  el.hidden = false; el.className = 'msg ' + (kind || ''); el.textContent = text;
  if (list && list.length) { const ul = document.createElement('ul'); list.forEach((x) => { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); }); el.appendChild(ul); }
}
async function api(path, { method = 'GET', body, key } = {}) {
  const h = { 'Content-Type': 'application/json', 'X-Device-Id': deviceId() };
  const t = store.get('pv_tok'); if (t) h.Authorization = 'Bearer ' + t;
  if (key) h['Idempotency-Key'] = key;
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 75000);
  try {
    const r = await fetch(API + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal });
    let data = {}; try { data = await r.json(); } catch {}
    if (r.status === 401 && t) { logout(); }
    return { ok: r.ok, status: r.status, data };
  } catch { return { ok: false, status: 0, data: { message: 'Cannot reach the server. Check your internet and try again.' } }; }
  finally { clearTimeout(to); }
}

/* ---- sign up / log in ---- */
let mode = 'up';
function setMode(m) {
  mode = m;
  $('#tabUp').setAttribute('aria-selected', m === 'up'); $('#tabIn').setAttribute('aria-selected', m === 'in');
  $('#nameRow').hidden = m !== 'up'; $('#authBtn').textContent = m === 'up' ? 'Create account' : 'Log in';
  $('#authMsg').hidden = true;
}
$('#tabUp').onclick = () => setMode('up'); $('#tabIn').onclick = () => setMode('in');
$('#authBtn').onclick = async () => {
  const phone = $('#phone').value.trim(), pin = $('#pin').value.trim(), name = $('#name').value.trim();
  if (!/^\+?\d{10,15}$/.test(phone)) return say($('#authMsg'), 'Enter a valid phone number.', 'err');
  if (!/^\d{4,6}$/.test(pin)) return say($('#authMsg'), 'Your PIN must be 4 to 6 digits.', 'err');
  if (mode === 'up' && !name) return say($('#authMsg'), 'Enter your name.', 'err');
  $('#authBtn').disabled = true; say($('#authMsg'), 'Please wait...');
  const r = mode === 'up' ? await api('/auth/register', { method: 'POST', body: { phone, name, pin } }) : await api('/auth/login', { method: 'POST', body: { phone, pin } });
  $('#authBtn').disabled = false;
  if (!r.ok) return say($('#authMsg'), r.status === 409 ? 'That phone number is already registered. Log in instead.' : (r.data.message || 'Something went wrong.'), 'err');
  store.set('pv_tok', r.data.token);
  if (r.data.user) store.set('pv_name', r.data.user.name);
  $('#pin').value = '';
  showApp();
};
function logout() { store.del('pv_tok'); store.del('pv_name'); $('#auth').hidden = false; $('#app').hidden = true; setMode('in'); }
$('#logout').onclick = logout;

/* ---- wallet ---- */
async function showApp() {
  $('#auth').hidden = true; $('#app').hidden = false;
  $('#hello').textContent = 'Hi' + (store.get('pv_name') ? ', ' + store.get('pv_name').split(' ')[0] : '');
  $('#fund').hidden = store.get('pv_nofund') === '1';
  await load();
}
async function load() {
  const w = await api('/wallet');
  if (w.ok) { $('#bal').textContent = naira(w.data.balanceKobo); $('#acct').textContent = 'Account ' + w.data.accountNumber; $('#copy').dataset.n = w.data.accountNumber; }
  const t = await api('/wallet/transactions');
  const box = $('#txs'); box.textContent = '';
  if (!t.ok || !t.data.length) { box.innerHTML = '<p class="mut">No activity yet.</p>'; return; }
  t.data.forEach((x) => {
    const d = document.createElement('div'); d.className = 'tx';
    const left = document.createElement('div');
    const label = x.kind === 'transfer' ? (x.amount_kobo < 0 ? 'Sent to ' + (x.meta && x.meta.to || '') : 'Received') : x.kind.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());
    left.textContent = label;
    const dt = document.createElement('div'); dt.className = 'mut'; dt.textContent = new Date(x.created_at).toLocaleString(); left.appendChild(dt);
    const amt = document.createElement('b'); amt.className = x.amount_kobo < 0 ? 'neg' : 'pos';
    amt.textContent = (x.amount_kobo < 0 ? '−' : '+') + naira(Math.abs(x.amount_kobo));
    d.append(left, amt); box.appendChild(d);
  });
}
$('#refresh').onclick = load;
$('#copy').onclick = async () => { try { await navigator.clipboard.writeText($('#copy').dataset.n || ''); $('#copy').textContent = 'Copied'; setTimeout(() => ($('#copy').textContent = 'Copy'), 1500); } catch {} };
$('#fund').onclick = async () => {
  const r = await api('/wallet/dev-fund', { method: 'POST', body: { amount_kobo: 500000 } });
  if (r.status === 404) { store.set('pv_nofund', '1'); $('#fund').hidden = true; return; }
  if (r.ok) load(); else say($('#sendMsg'), r.data.message || 'Could not add test money.', 'err');
};

/* ---- send money ---- */
let attempt = null; // keeps one idempotency key per payment so retries never double-charge
$('#sendForm').addEventListener('input', (e) => { if (e.target.id !== 'spin') { attempt = null; $('#pinBox').hidden = true; } });
$('#sendForm').onsubmit = async (e) => {
  e.preventDefault();
  const to = $('#to').value.trim(), amt = Math.round(parseFloat($('#amt').value) * 100), note = $('#note').value.trim(), pin = $('#spin').value.trim();
  const m = $('#sendMsg');
  if (!/^\d{10}$/.test(to)) return say(m, 'Enter the 10-digit account number.', 'err');
  if (!(amt > 0)) return say(m, 'Enter an amount above ₦0.', 'err');
  if (!attempt) attempt = crypto.randomUUID();
  $('#sendBtn').disabled = true; say(m, 'Sending...');
  const r = await api('/wallet/transfer', { method: 'POST', key: attempt, body: { to_account_number: to, amount_kobo: amt, narration: note || undefined, pin: pin || undefined } });
  $('#sendBtn').disabled = false;
  const s = r.data.status;
  if (s === 'completed' || s === 'duplicate') {
    say(m, 'Sent ' + naira(amt) + ' to ' + to + '.', 'ok'); attempt = null; $('#sendForm').reset(); $('#pinBox').hidden = true; load();
  } else if (s === 'step_up_required') {
    $('#pinBox').hidden = false; $('#spin').focus(); say(m, 'For your safety, confirm this payment with your PIN, then tap Send again.', '', r.data.risk && r.data.risk.reasons);
  } else if (s === 'blocked') {
    attempt = null; say(m, 'We blocked this payment because it looks risky.', 'err', r.data.risk && r.data.risk.reasons);
  } else {
    if (r.data.error === 'BAD_PIN') { $('#spin').value = ''; }
    say(m, r.data.message || 'Payment failed.', 'err');
  }
};

/* ---- start ---- */
(async function init() {
  setMode('up');
  if (store.get('pv_tok')) showApp();
  $('#banner').hidden = false;
  try { await fetch(API + '/health'); } catch {}
  $('#banner').hidden = true;
})();
</script></body></html>
